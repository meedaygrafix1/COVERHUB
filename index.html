<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#007aff" />
    <title>Spidra Cover Studio</title>
    <meta name="description" content="Paste a blog post title, pick a style, and Claude composes an on-brand cover illustration you can edit like Figma. Export PNG or SVG." />

    <!-- social previews: %VITE_SITE_URL% is the production URL, filled in at build time (see vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spidra Cover Studio" />
    <meta property="og:title" content="Cover Studio: blog covers, designed from a title" />
    <meta property="og:description" content="Paste a post title, pick a style, and Claude composes an on-brand illustration you can edit like Figma." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Cover Studio editor: an AI-composed blog cover with layers, a selected card and the design panel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cover Studio: blog covers, designed from a title" />
    <meta name="twitter:description" content="Paste a post title, pick a style, and Claude composes an on-brand illustration you can edit like Figma." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
    <script>
      // apply the saved theme before first paint (see src/lib/theme.ts)
      try {
        var t = localStorage.getItem('scs.theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
